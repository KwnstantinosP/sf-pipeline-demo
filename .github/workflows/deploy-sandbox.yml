name: Deploy to SIT / UAT
run-name: "Deploy ${{ github.ref_name }} → ${{ github.ref_name == 'uat' && 'UAT' || 'SIT' }}, then regression tests"

# Merge to develop deploys to SIT, merge to uat deploys to UAT. Only the delta since the
# last successful deploy goes out; the deployed/<env> tag records where that was.
# The regression tests then run against the freshly deployed org.
on:
  push:
    branches: [develop, uat]
    paths: ['force-app/**', 'tests/**']

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'uat' && 'UAT' || 'SIT' }}
    env:
      DEPLOY_TAG: ${{ github.ref_name == 'uat' && 'deployed/uat' || 'deployed/sit' }}
      TEST_POLICY: ${{ github.ref_name == 'uat' && 'local' || 'specified' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/sf-setup
        with:
          auth-url: ${{ secrets.SFDX_AUTH_URL }}

      - name: Build delta since last deploy
        id: delta
        run: |
          FROM=$(git rev-parse -q --verify "refs/tags/$DEPLOY_TAG" || true)
          ./scripts/ci/build-delta.sh "$FROM" HEAD "$TEST_POLICY"

      - name: Deploy
        if: steps.delta.outputs.has_changes == 'true'
        run: ./scripts/ci/deploy-delta.sh deploy "${{ steps.delta.outputs.test_level }}" "${{ steps.delta.outputs.tests }}"

      - name: Record deployed commit
        run: git push --force origin "${GITHUB_SHA}:refs/tags/${DEPLOY_TAG}"

  regression:
    needs: deploy
    uses: ./.github/workflows/regression.yml
    with:
      environment: ${{ github.ref_name == 'uat' && 'UAT' || 'SIT' }}
      ref: ${{ github.sha }}
    secrets: inherit
