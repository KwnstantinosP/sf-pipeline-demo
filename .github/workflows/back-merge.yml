name: Back-merge

# Keeps the lower branches up to date by opening PRs one step down the chain:
#   main -> uat      after a hotfix or release lands on main
#   uat  -> develop  after a QA fix (or a merged main -> uat back-merge) lands on uat
# Merging a main -> uat PR pushes to uat, which opens the uat -> develop PR in turn.
on:
  push:
    branches: [main, uat]

permissions:
  contents: read
  pull-requests: write

jobs:
  back-merge:
    runs-on: ubuntu-latest
    env:
      SOURCE: ${{ github.ref_name }}
      TARGET: ${{ github.ref_name == 'main' && 'uat' || 'develop' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compares content, not history: a develop -> uat promotion leaves nothing new for
      # develop, so no PR is opened for it.
      - name: Open back-merge PR if the target is missing changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged_tree=$(git merge-tree --write-tree "origin/$TARGET" "origin/$SOURCE" | head -1 || true)
          target_tree=$(git rev-parse "origin/$TARGET^{tree}")
          if [ "$merged_tree" = "$target_tree" ]; then
            echo "$TARGET already contains everything on $SOURCE."
            exit 0
          fi
          open=$(gh pr list --base "$TARGET" --head "$SOURCE" --state open --json number --jq length)
          if [ "$open" != "0" ]; then
            echo "A back-merge PR from $SOURCE into $TARGET is already open."
            exit 0
          fi
          gh pr create --base "$TARGET" --head "$SOURCE" \
            --title "Back-merge $SOURCE into $TARGET" \
            --body "Automatic back-merge after ${GITHUB_SHA:0:7} landed on $SOURCE. Merge with a merge commit, not squash."
